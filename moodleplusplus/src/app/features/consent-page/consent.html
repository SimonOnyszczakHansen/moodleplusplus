<div class="consent-page">
  <mat-card class="consent-card">
    <mat-card-header>
      <mat-card-title>Samtykke</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <p>
        For at fortsætte skal du acceptere brugen af dine data i henhold til vores privacy-policy.
      </p>

      <label class="consent-checkbox">
        <input type="checkbox" [(ngModel)]="accepted" />
        <span>Jeg accepterer samtykket og vil fortsætte.</span>
      </label>

      <div *ngIf="errorMessage" class="error-banner">
        {{ errorMessage }}
      </div>
    </mat-card-content>

    <mat-card-actions>
      <button
        mat-raised-button
        color="primary"
        type="button"
        [disabled]="isSubmitting || !accepted"
        (click)="submitConsent()"
      >
        {{ isSubmitting ? 'Gemmer...' : 'Accepter samtykke' }}
      </button>
    </mat-card-actions>
  </mat-card>
</div>

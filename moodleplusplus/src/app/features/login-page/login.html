<div class="login-container"> 
    <mat-card class="login-card"> 
        <mat-card-header class="header-center"><mat-card-title>Log In</mat-card-title></mat-card-header>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <mat-card-content>
               <div *ngIf="errorMessage" class="error-banner">{{ errorMessage }}</div>
                <mat-form-field appearance="outline" class="full-width-input"> 
                    <mat-label>Email</mat-label>
                    <input matInput formControlName="email">
                    <mat-error *ngIf="email?.invalid && email?.touched">
                        <span *ngIf="email?.errors?.['required']">Email is required.</span>
                    </mat-error>
                </mat-form-field>
                <mat-form-field appearance="outline" class="full-width-input"> 
                    <mat-label>Password</mat-label>
                    <input matInput type="password" formControlName="password">
                </mat-form-field>
            </mat-card-content>
            <mat-card-actions class="actions-center"> 
                <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid">Log In</button>
            </mat-card-actions>
        </form>
    </mat-card>
</div>

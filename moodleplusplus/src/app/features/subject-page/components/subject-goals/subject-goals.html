<div class="container">
    <app-back-button></app-back-button>
    <header class="page-header">
        <div class="breadcrumb">Mine Fag / {{ subjectTitle }} / Opgaver</div>
        @if (isTeacher) {
        <app-button (click)="onCreateGoal()" variant="primary">Opret Målpind</app-button>
        }
    </header>

    <app-table [columns]="columns" [rows]="rows()" [actions]="actions" emptyMessage="Ingen målpinde fundet."
        (actionClick)="onActionClick($event)">
    </app-table>

    <app-modal [(open)]="showCreateGoal" [title]="goalId ? 'Rediger Målpind' : 'Opret Målpind'">
        @if (goalId) {
        <app-input label="Målpind" placeholder="Skriv målpind" [(value)]="formContent"></app-input>
        } @else {
        <div class="goal-input-row">
            <app-input placeholder="Skriv målpind" [(value)]="goalDraft"></app-input>
            <app-button variant="secondary" (click)="addGoalToList()">Tilføj</app-button>
        </div>

        @if (goalEntries.length) {
        <ul class="goal-entry-list">
            @for (goal of goalEntries; track goal; let i = $index) {
            <li class="goal-entry-item">
                <span>{{ goal }}</span>
                <button type="button" aria-label="Fjern {{ goal }}" (click)="removeGoalFromList(i)">&times;</button>
            </li>
            }
        </ul>
        }
        }

        <div class="modal-actions">
            <app-button variant="secondary" (click)="onCancelGoal()">Anuller</app-button>
            <app-button variant="primary" (click)="onSubmitGoal()"
                [disabled]="goalId ? !formContent.trim() : !goalEntries.length">{{ goalId ? 'Gem' : 'Opret'
                }}</app-button>
        </div>
    </app-modal>

    <app-modal [(open)]="showDeleteGoal" [title]="'Fjern Målpind'">
        <app-input label="Skriv 'CONFIRM' for at slette målpinden" placeholder="CONFIRM"
            [(value)]="deleteConfirm"></app-input>

        <div class="modal-actions">
            <app-button variant="secondary" (click)="onCancelGoal()">Anuller</app-button>
            <app-button variant="danger" [disabled]="isConfirmed" (click)="onSubmitDeleteGoal()">Fjern</app-button>
        </div>
    </app-modal>
</div>

<div class="subject-cards">
  @for (subject of subjects(); track subject.id) {
  <app-card title="{{ subject.name }}">
    <div class="card-content">
      @if (!isTeacher) {
      <app-progress-bar [value]="subject.subjectProgress"></app-progress-bar>
      }
      <div class="button-container">
        <app-button variant="primary" (click)="viewSubject(subject.id)">Gå til fag</app-button>
      </div>
    </div>
  </app-card>
  }
</div>

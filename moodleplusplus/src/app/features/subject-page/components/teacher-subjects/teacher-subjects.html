<div class="subject-cards">
  <div *ngFor="let subject of subjects">
    <app-card title="{{ subject.name }}">
      <div class="card-content">
        <div class="button-container">
          <app-button variant="primary" (click)="viewSubject(subject.id)">Se Fag</app-button>
        </div>
      </div>
    </app-card>
  </div>
</div>

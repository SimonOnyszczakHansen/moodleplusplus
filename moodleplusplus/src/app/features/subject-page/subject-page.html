<div class="container">
  <header class="page-header">
    <div class="breadcrumb">Mine Fag</div>
    @if (userRole === 'teacher') {
    <app-button variant="primary" (click)="onCreateSubject()">Opret Fag</app-button>
    }
  </header>

  <app-modal [(open)]="showCreateSubject" [title]="'Opret Opgave'">
    <app-input label="Navn" placeholder="Navn" [(value)]="subjectName"></app-input>

    <div class="modal-actions">
      <app-button label="Annuller" variant="secondary" (click)="onCancelCreateSubject()">Anuller</app-button>
      <app-button label="Opret" variant="primary" (click)="onSubmitSubject()">Opret</app-button>
    </div>
  </app-modal>

  <app-subject-list></app-subject-list>
</div>
